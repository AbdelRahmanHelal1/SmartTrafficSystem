services:
  mongodb:
    image: mongo:7
    container_name: smart_traffic_mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 }).ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smart_traffic_backend
    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      MONGODB_DB_NAME: smart_traffic
      STORAGE_DIR: /storage

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/code
      - ./storage:/storage

  frontend:
    build: ./frontend
    container_name: smart_traffic_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5500:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mongo_data: