<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Traffic Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #14110f; color: #eee; }
    header { padding: 16px 24px; background: #1e1a17; border-bottom: 1px solid #333; }
    h1 { margin: 0; font-size: 20px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 24px; align-items: end; }
    label { display: flex; flex-direction: column; font-size: 12px; gap: 4px; color: #aaa; }
    input { padding: 8px; border-radius: 6px; border: 1px solid #444; background: #221e1b; color: #eee; }
    button { padding: 9px 18px; border: 0; border-radius: 6px; background: #ffd700; color: #000; font-weight: 600; cursor: pointer; }
    button.secondary { background: #333; color: #eee; }
    #status { padding: 0 24px; color: #aaa; font-size: 13px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px 24px; }
    .card { background: #221e1b; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
    .card img.vehicle { width: 100%; height: 170px; object-fit: cover; display: block; background: #000; }
    .plate-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; }
    .plate-row img { height: 36px; border-radius: 4px; background: #000; }
    .plate-text { background: #ffd700; color: #000; font-weight: 700; padding: 4px 10px; border-radius: 4px; letter-spacing: 1px; }
    .meta { padding: 8px 12px 12px; font-size: 12px; color: #aaa; line-height: 1.6; }
  </style>
</head>
<body>
  <header><h1>Smart Traffic System - Dashboard</h1></header>

  <form id="filters">
    <label>Plate number <input name="plate_number" placeholder="e.g. KH05"></label>
    <label>Camera ID <input name="camera_id" placeholder="e.g. cam1"></label>
    <label>From <input type="datetime-local" name="start_time"></label>
    <label>To <input type="datetime-local" name="end_time"></label>
    <button type="submit">Search</button>
    <button type="button" class="secondary" id="resetBtn">Reset</button>
  </form>

  <div id="status"></div>
  <div id="grid"></div>

  <script>
    const API = "http://localhost:8000";
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("filters");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderCard(v) {
      const card = el("div", "card");

      if (v.vehicle_image_path) {
        const img = el("img", "vehicle");
        img.src = `${API}/storage/${v.vehicle_image_path}`;
        img.alt = "vehicle";
        card.appendChild(img);
      }

      const row = el("div", "plate-row");
      row.appendChild(el("span", "plate-text", v.plate_number));
      if (v.plate_image_path) {
        const p = el("img");
        p.src = `${API}/storage/${v.plate_image_path}`;
        p.alt = "plate";
        row.appendChild(p);
      }
      card.appendChild(row);

      const meta = el("div", "meta");
      meta.appendChild(el("div", "", `Camera: ${v.camera_id}  |  Track: ${v.track_id}`));
      meta.appendChild(el("div", "", `Type: ${v.vehicle_type ?? "-"}  |  Confidence: ${(v.plate_confidence * 100).toFixed(0)}%`));
      meta.appendChild(el("div", "", new Date(v.detected_at).toLocaleString()));
      card.appendChild(meta);

      return card;
    }

    async function load() {
      const params = new URLSearchParams();
      for (const [key, value] of new FormData(form)) {
        if (!value) continue;
        // datetime-local بيرجع وقت محلي، بنحوّله لـ UTC قبل الإرسال
        params.set(key, key.endsWith("_time") ? new Date(value).toISOString() : value);
      }

      statusEl.textContent = "Loading...";
      try {
        const res = await fetch(`${API}/vehicles?${params}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const vehicles = await res.json();

        grid.replaceChildren(...vehicles.map(renderCard));
        statusEl.textContent = `${vehicles.length} vehicle(s)`;
      } catch (err) {
        grid.replaceChildren();
        statusEl.textContent = `Failed to load: ${err.message}`;
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); load(); });
    document.getElementById("resetBtn").addEventListener("click", () => { form.reset(); load(); });
    load();
  </script>
</body>
</html>
