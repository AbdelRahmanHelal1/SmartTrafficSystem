<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Traffic | Live Monitoring</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    background: #111827;
    color: #e5e7eb;
}

header {
    height: 72px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #182230;
    border-bottom: 1px solid #293548;
}

.brand {
    font-size: 19px;
    font-weight: 700;
}

.brand span {
    color: #fbbf24;
}

nav {
    display: flex;
    gap: 12px;
}

nav a {
    color: #9ca3af;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 7px;
    font-size: 13px;
}

nav a.active,
nav a:hover {
    background: #293548;
    color: #fbbf24;
}

.container {
    padding: 26px 30px;
    max-width: 1600px;
    margin: auto;
}

.page-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.page-heading h1 {
    margin: 0 0 6px;
    font-size: 25px;
}

.page-heading p {
    margin: 0;
    color: #9ca3af;
    font-size: 13px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: #9ca3af;
}

.dot {
    width: 9px;
    height: 9px;
    background: #f59e0b;
    border-radius: 50%;
}

.dot.online {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e80;
}

.dot.offline {
    background: #ef4444;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
}

.panel {
    background: #182230;
    border: 1px solid #293548;
    border-radius: 12px;
    overflow: hidden;
}

.panel-header {
    height: 55px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #293548;
}

.panel-header h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
}

.live-tag {
    color: #f87171;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.video-container {
    background: #080d16;
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

#liveVideo {
    display: block;
    width: 100%;
    height: auto;
    max-height: 75vh;
    object-fit: contain;
}

.video-placeholder {
    color: #9ca3af;
    padding: 70px 20px;
    text-align: center;
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.stat-card {
    padding: 19px;
}

.stat-title {
    color: #9ca3af;
    font-size: 12px;
}

.stat-value {
    font-size: 29px;
    font-weight: 700;
    margin-top: 10px;
    color: #fbbf24;
}

.recent-list {
    padding: 8px 16px;
}

.vehicle-item {
    padding: 13px 0;
    border-bottom: 1px solid #293548;
}

.vehicle-item:last-child {
    border-bottom: 0;
}

.plate {
    display: inline-block;
    background: #fbbf24;
    color: #111827;
    padding: 5px 9px;
    border-radius: 5px;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
}

.vehicle-info {
    color: #9ca3af;
    font-size: 11px;
    margin-top: 8px;
}

.empty {
    color: #9ca3af;
    text-align: center;
    padding: 25px 10px;
    font-size: 12px;
}

@media (max-width: 950px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    header {
        padding: 0 15px;
    }

    .container {
        padding: 20px 14px;
    }

    .sidebar {
        grid-template-columns: 1fr;
    }

    .page-heading h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">SMART <span>TRAFFIC</span></div>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="live-monitoring.html" class="active">Live Monitoring</a>
    </nav>
</header>

<main class="container">

    <section class="page-heading">
        <div>
            <h1>Live Monitoring</h1>
            <p>Real-time vehicle detection and license plate recognition</p>
        </div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="connectionStatus">Connecting...</span>
        </div>
    </section>

    <section class="layout">

        <div class="panel">
            <div class="panel-header">
                <h2>Camera Feed — CAM 1</h2>
                <span class="live-tag">● LIVE</span>
            </div>

            <div class="video-container">
                <img
                    id="liveVideo"
                    src="http://localhost:8001/video_feed"
                    alt="Live camera stream"
                >
            </div>
        </div>

        <aside class="sidebar">

            <div class="panel stat-card">
                <div class="stat-title">Total Detected Vehicles</div>
                <div class="stat-value" id="totalVehicles">--</div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Recent Detections</h2>
                </div>

                <div class="recent-list" id="recentVehicles">
                    <div class="empty">Loading detections...</div>
                </div>
            </div>

        </aside>

    </section>

</main>

<script>
const API = "http://localhost:8000";

const video = document.getElementById("liveVideo");
const statusDot = document.getElementById("statusDot");
const connectionStatus = document.getElementById("connectionStatus");
const totalVehicles = document.getElementById("totalVehicles");
const recentVehicles = document.getElementById("recentVehicles");

video.onload = () => {
    statusDot.className = "dot online";
    connectionStatus.textContent = "Stream Connected";
};

video.onerror = () => {
    statusDot.className = "dot offline";
    connectionStatus.textContent = "Stream Disconnected";
};

async function loadDetections() {
    try {
        const response = await fetch(`${API}/vehicles`);

        if (!response.ok) {
            throw new Error("Backend unavailable");
        }

        const vehicles = await response.json();

        totalVehicles.textContent = vehicles.length;

        const recent = [...vehicles]
            .sort((a, b) =>
                new Date(b.detected_at) - new Date(a.detected_at)
            )
            .slice(0, 5);

        recentVehicles.replaceChildren();

        if (recent.length === 0) {
            recentVehicles.innerHTML =
                '<div class="empty">No vehicles detected yet</div>';
            return;
        }

        recent.forEach(vehicle => {
            const item = document.createElement("div");
            item.className = "vehicle-item";

            const plate = document.createElement("div");
            plate.className = "plate";
            plate.textContent = vehicle.plate_number || "Unknown";

            const info = document.createElement("div");
            info.className = "vehicle-info";
            info.textContent =
                `${vehicle.vehicle_type || "-"} · ${vehicle.camera_id || "-"}`;

            item.append(plate, info);
            recentVehicles.appendChild(item);
        });

    } catch (error) {
        totalVehicles.textContent = "--";
        recentVehicles.innerHTML =
            '<div class="empty">Cannot connect to backend</div>';
    }
}

loadDetections();
setInterval(loadDetections, 5000);
</script>

</body>
</html>
